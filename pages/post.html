<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <title>Lista destinos</title>
        <link rel="stylesheet" href="../css/style.css" />
        <script src="../js/post.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Cadastro de series </h1>
            <p>Preencha os dados abaixo!!</p>
        </header>
        <main>
            <section>
                <p><a href="../index.html">Consultar Series</a></p>
                <h2>Nova Series</h2>

                <form id="form-serie">
                    <label for="title">Nome da serie: </label>
                    <input id="title" name="title" type="text" minlength="3" maxlength="120" required />

                    <label for="genero">genero: </label>
                     <input id="genero" name="genero" type="text" required />

                     <label for="numero_temporadas">numero_temporadas": </label>
                       <input id="numero_temporadas" name="numero_temporadas" type="text" required />

                       <label for="ano_lancamento">Ano de Lançamento: </label>
                       <input id="ano_lancamento" name="ano_lancamento" type="text" required />

                        <label for="plataforma">Plataforma: </label>
                        <input id="plataforma" name="plataforma" type="text" required />

                         <label for="imageUrl">URL da imagem (opcional): </label>
          <input id="imageUrl" name="imageUrl" type="url" />


          <button type="submit">Cadastrar Series</button>
                </form>

                <p id="resposta"></p>

            </section>
        </main>
    </body>
</html>
